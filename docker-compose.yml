version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cmms_postgres
    environment:
      POSTGRES_USER: cmms_user
      POSTGRES_PASSWORD: cmms_password
      POSTGRES_DB: cmms_plastics
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cmms_user']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cmms_app
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://cmms_user:cmms_password@db:5432/cmms_plastics
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-this-secret-in-production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
